[project]
name = "ptq"
version = "0.1.0"
description = "Lightweight post-training quantization experiments aligned with llm-compressor and vLLM"
readme = "notes/plan_verified.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.13.0",
  "compressed-tensors>=0.11.0",
  "datasets>=4.0.0",
  "immutabledict>=4.2.1",
  "langdetect>=1.0.9",
  "lm-eval>=0.4.8",
  "numpy>=2.2.0",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "ray>=2.54.0",
  "safetensors>=0.6.0",
  "torch>=2.5.0",
  "transformers>=4.52.0",
  "vllm>=0.10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.7",
]

[project.scripts]
ptq = "ptq.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptq"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
